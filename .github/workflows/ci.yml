on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make Maven wrapper executable
        shell: bash
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
          fi
          
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          
      - name: Compile code and execute tests
        run: ./mvnw clean test
        
      - name: Check Code Coverage
        run: ./mvnw -B jacoco:prepare-agent clean test jacoco:report verify
